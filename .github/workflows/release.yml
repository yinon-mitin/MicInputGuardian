name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 != '' && secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD != '' && secrets.DEVELOPER_ID_APPLICATION_IDENTITY != '' }}
      HAS_NOTARIZATION_CREDENTIALS: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 != '' && secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD != '' && secrets.DEVELOPER_ID_APPLICATION_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive version from tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic-version tag such as v1.2.3" >&2
            exit 1
          fi
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./script/build_and_run.sh --release

      - name: Verify architecture and bundle
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          test "$(lipo -archs dist/MicInputGuardian.app/Contents/MacOS/MicInputGuardian)" = "${{ matrix.arch }}"
          plutil -lint dist/MicInputGuardian.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/MicInputGuardian.app

      - name: Import Developer ID certificate
        if: ${{ env.HAS_SIGNING_CERTIFICATE == 'true' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mic-input-guardian.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Sign with Developer ID
        if: ${{ env.HAS_SIGNING_CERTIFICATE == 'true' }}
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          codesign --force --deep \
            --options runtime \
            --timestamp \
            --sign "$SIGNING_IDENTITY" \
            dist/MicInputGuardian.app
          codesign --verify --deep --strict --verbose=2 dist/MicInputGuardian.app

      - name: Prepare notarization upload
        if: ${{ env.HAS_NOTARIZATION_CREDENTIALS == 'true' }}
        run: |
          ditto -c -k --keepParent \
            dist/MicInputGuardian.app \
            "$RUNNER_TEMP/MicInputGuardian-notarization.zip"

      - name: Notarize and staple
        if: ${{ env.HAS_NOTARIZATION_CREDENTIALS == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit \
            "$RUNNER_TEMP/MicInputGuardian-notarization.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/MicInputGuardian.app
          xcrun stapler validate dist/MicInputGuardian.app

      - name: Create release archive and checksum
        shell: bash
        run: |
          mkdir -p release
          ARCHIVE="MicInputGuardian-${APP_VERSION}-macOS-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/MicInputGuardian.app \
            "release/$ARCHIVE"
          cd release
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: MicInputGuardian-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Mic Input Guardian $GITHUB_REF_NAME" \
            --generate-notes
